[project]
name = "desktop-launcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
desktop-launcher = "desktop_launcher:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = [
    "nuitka>=4.3.1",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
